name: StatusTimer
options:
  bundleIdPrefix: com.endurance
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  StatusTimer:
    type: application
    platform: macOS
    sources:
      - StatusTimer
    settings:
      base:
        INFOPLIST_FILE: StatusTimer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.endurance.StatusTimer
        PRODUCT_NAME: StatusTimer
        ARCHS: arm64
        VALID_ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
